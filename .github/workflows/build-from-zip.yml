name: Build MAC TRAC from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "MAC_TRAC_GitHub_APK_READY.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MAC TRAC project
        run: |
          mkdir project
          unzip -q MAC_TRAC_GitHub_APK_READY.zip -d project
          
          if [ -f project/settings.gradle.kts ]; then
            cp -r project/. .
          else
            echo "ERROR: Android project files were not found."
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Verify Android project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Android project verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build MAC TRAC APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAC-TRAC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
